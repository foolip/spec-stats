# Fetch GitHub data for the repos in config/repos.txt, on demand.
#
# Everything fetched is committed to this repo, in data/github/
# (docs/extraction.md), at the end of every run, even one that failed or
# stopped at its deadline, so the next run resumes from there. The
# exception: if main moved during the run, the run fails and its data is
# dropped, as the code that collected it may be out of date. A backfill
# bigger than one run takes several runs. The first run fetches each
# repo's whole history; later runs only what changed.
#
# Token: the SPECSTATS_TOKEN secret if set (a fine-grained personal token
# with no extra permissions: 5,000 requests an hour), otherwise the
# built-in token (1,000 an hour). A run never waits for quota: it stops
# when the hourly budget is down to its reserve (about 20 minutes into a
# backfill), commits, and the next run, an hour later, continues.
# Contact for the User-Agent: the SPECSTATS_CONTACT variable, if set.
#
# The fetch stores what GitHub returns, consistent or not. The consistency
# checks are a separate workflow (check.yml), triggered manually.

name: Fetch GitHub data

on:
  workflow_dispatch:
    inputs:
      reconcile:
        description: "Also re-list every issue and PR, to catch deletions and missed updates (weekly)"
        type: boolean
        default: false

concurrency:
  group: github-data  # one run at a time: each builds on the previous one's commit
  cancel-in-progress: false

permissions:
  contents: write  # to commit data/github/

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GITHUB_TOKEN: ${{ secrets.SPECSTATS_TOKEN || github.token }}
      SPECSTATS_CONTACT: ${{ vars.SPECSTATS_CONTACT }}
      PYTHONUNBUFFERED: "1"  # log lines appear as they're printed, not at exit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The fetch stops itself after 300 minutes (no request starts after
      # that), leaving time to commit. The step timeout is
      # a backstop; a timed-out step still lets the commit step run.
      - name: Fetch
        timeout-minutes: 320
        run: python3 -m specstats extract --max-minutes 300 ${{ inputs.reconcile && '--reconcile' || '' }}

      - name: Commit the fetched data
        if: always()
        run: |
          git add data/github
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          # If main moved during the run, the collection code may have
          # changed under it, so the data isn't committed: fail instead.
          # (A push that races a later move is rejected as non-fast-forward.)
          git fetch -q origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::main moved from $GITHUB_SHA to $(git rev-parse FETCH_HEAD) during the run; not committing its data"
            exit 1
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update GitHub data"
          git push -q origin HEAD:main

      - name: Report
        if: always()
        run: |
          python3 -m specstats stats >> "$GITHUB_STEP_SUMMARY"
