# Consistency checks on the stored data (`python3 -m specstats check`),
# kept apart from the fetch: the fetch stores what GitHub returns,
# consistent or not, and these look for bugs in the end-to-end process
# (docs/extraction.md). Offline: reads data/github/ on main, no API
# requests, no token. A finding fails this workflow, not the fetch.
#
# Manually triggered for now (Actions → "Check data" → Run workflow).

name: Check data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check
        run: |
          set -o pipefail  # fail on findings, not only if tee fails
          python3 -m specstats check | tee -a "$GITHUB_STEP_SUMMARY"
